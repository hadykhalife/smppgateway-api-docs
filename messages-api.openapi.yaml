  /api/v1/messages/batch:
    post:
      tags:
        - Messages
      operationId: SubmitBatch
      summary: Submit up to 1000 messages
      description: >-
        Each message is processed as by `POST /api/v1/messages`, with its own `requestId`, and gets its own result: the
        answer is **207** with one entry per index whose `status` is what the single call would have answered (202, 200,
        400, 409, 422, 503…). Retry only the entries that failed, with the same requestIds. Requires `messages.submit`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/SubmitMessageRequest"
            example:
              messages:
                - requestId: promo-0001
                  sender: ACME
                  destination: "+96170123457"
                  message: Batch one
                - requestId: promo-0002
                  sender: ACME
                  destination: "9"
                  message: Batch two
      responses:
        "207":
          description: One result per message, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
              example:
                results:
                  - index: 0
                    status: 202
                    publicId: 01a0f78b-91d6-750c-ae56-d7c68c717a76
                    problem: null
                  - index: 1
                    status: 400
                    publicId: null
                    problem: Destination must be an international number of 7–15 digits.
        "400":
          description: The batch is empty or holds more than 1000 messages; nothing was processed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
