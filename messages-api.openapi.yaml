  /api/v1/messages/{publicId}/cancel:
    post:
      tags:
        - Messages
      operationId: CancelMessage
      summary: Cancel a message not yet sent
      description: >-
        Stops a message that is still waiting (scheduled, queued or retrying). Once it is being sent, or is final, it
        can no longer be cancelled. Requires `messages.cancel`.
      parameters:
        - name: publicId
          in: path
          required: true
          description: The message id returned at submission (`publicId`).
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Why; stored with the message.
            example:
              reason: customer withdrew
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageStateResult"
              example:
                publicId: 01a0f78b-9160-77db-8997-e0c1605bbf6f
                state: Cancelled
                reason: customer withdrew
