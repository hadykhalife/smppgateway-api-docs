openapi: 3.1.0
info:
  title: SMPP Gateway — Message Submission API
  version: 1.0.0
  description: >-
    Submit SMS messages to the SMPP Gateway Management Platform and follow them to delivery.


    ## Authentication

    Every call carries an API key in the `X-Api-Key` header. Keys are issued by the platform operator (API keys page),
    shown

    once, and carry permissions: `messages.submit` to send, `messages.read` to read, `messages.cancel` to cancel. A key
    may

    also be limited to certain senders and source addresses. A key sees only the messages sent with it.


    ## Delivery is asynchronous

    A successful submission answers **202 Accepted**: the message is stored and queued, not yet delivered. Follow it
    with

    `GET /api/v1/messages/{publicId}`, or ask the operator to configure a webhook integration for delivery receipts.

    Typical states: `Routing` → `Queued` → `Sending` → `Submitted` → `Delivered`, or a final `Undelivered`,

    `Expired`, `Rejected`, `Failed` or `Cancelled`. `Unknown` means the SMSC may have the message but never confirmed

    it; it is not resent automatically.


    ## Safe retries

    `requestId` makes a submission idempotent per API key. On a timeout, a network error, a 429 or a 503, send the same

    request again with the same `requestId`: you get the original message back (200, `existing: true`) and nothing is
    sent

    twice. Use a new `requestId` for a new message.


    ## Errors

    Errors are `application/problem+json` with `type`, `title`, `status` and a `correlationId` to quote to the operator.

    Validation errors (400) list each problem in `errors` with its field `path` and a stable `code`. 409, 422 and 503

    carry the reason in `type` (for example `/errors/sender-not-allowed`). You can send your own `X-Correlation-Id` (a

    UUID); it is echoed on the response.


    ## Limits

    Each key has a submission rate (`rateLimitPerS`, set by the operator); above it the API answers 429. A batch holds
    at most

    1000 messages.
servers:
  - url: https://{host}
    variables:
      host:
        default: smppgw.example.com
        description: Your platform address.
security:
  - ApiKey: []
