      enum:
        - Auto
        - Gsm7
        - Latin1
        - Ucs2
        - Ascii
        - Utf8
      description: >-
        The coding an MT request asks for (spec Part 4 §7.1 step 3): automatic detection, a forced SMPP alphabet, or a

        content class. RequestedCoding.Ascii is printable 7-bit ASCII; the gateway decides whether it travels as the
        SMSC

        default alphabet or IA5 (the adapter's job). RequestedCoding.Utf8 is any Unicode text; SMPP has no UTF-8 coding,
        so

        it is always sent as UCS-2 and never downgraded to a 7-bit alphabet, even when the text would fit one.
