components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >-
        The key exactly as issued: `<prefix>.<secret>`, an 8-character prefix, a dot and a random secret (for example
        `abcd2345.EXAMPLE-not-a-real-key-0000000000000000000`).
  schemas:
    SubmitMessageRequest:
      type: object
      description: >-
        One message. `requestId`, `destination`, `message` and a sender (`sender` or `senderId`) are required. Older
        field names are still accepted: `to` for destination, `from` for sender, `text` for message; giving both names
        of a pair with different values is refused (`conflicting_alias`).
      required:
        - requestId
        - destination
        - message
      anyOf:
        - required:
            - sender
        - required:
            - senderId
        - required:
            - from
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[!-~]+$
          description: >-
            Your id for this business request, unique per API key: 1–64 visible ASCII characters (a UUID is a good
            choice). Sending the same requestId again with the same content returns the original message (200,
            `existing: true`) and sends nothing new, so a timed-out request can be retried safely. Different content
            under a used requestId is refused (409 `idempotency-conflict`).
          example: 7f3c2a9e-58b1-4c1e-9a07-5d2f0b6e1c44
        sender:
          type: string
          description: >-
            The sender the message is sent as (alphanumeric such as `ACME`, a short code or a number), as configured on
            the platform. A key restricted to some senders can use only those.
          example: ACME
        senderId:
          type: integer
          format: int32
          description: The sender by its platform id, instead of `sender`.
        destination:
          type: string
          description: "The recipient in international format: 7–15 digits, with or without a leading `+` (no national prefix)."
          example: "+96170123456"
        message:
          type: string
          description: >-
            The text. Long text is split into concatenated parts (153 GSM-7 or 67 UCS-2 characters each); at most 10
            parts unless the operator raised `messages.max_parts`.
          example: Your code is 4821
        dataCoding:
          $ref: "#/components/schemas/RequestedCoding"
          description: >-
            `Auto` (default) picks GSM-7 when the text fits it and UCS-2 otherwise. `Gsm7`, `Latin1` and `Ascii` force
            that alphabet and refuse text outside it (400 `message.not_gsm7`, …). `Ucs2` and `Utf8` send any Unicode
            text as UCS-2.
        gateway:
          type: string
          maxLength: 100
          description: >-
            Send only through this gateway (its code or name). The message is never moved to another gateway: if this
            one cannot take it, the request is refused instead.
        requestDlr:
          type: boolean
          default: true
          description: Ask the SMSC for a delivery receipt.
        priority:
          $ref: "#/components/schemas/MessagePriority"
          description: Queue priority; `Normal` by default.
        scheduledAtUtc:
          type: string
          format: date-time
          description: Send no earlier than this time (UTC, ISO 8601).
        validityS:
          type: integer
          minimum: 60
          maximum: 604800
          description: How long the SMSC should keep trying to deliver, in seconds (1 minute to 7 days).
        serviceCode:
          type: string
          maxLength: 32
          description: A service tag the operator's routing rules can match on.
        clientReference:
          type: string
          maxLength: 64
          description: Your own reference, stored with the message and searchable. Used as the requestId when that is absent.
        to:
          type: string
          deprecated: true
          description: Older name of `destination`.
        from:
          type: string
          deprecated: true
          description: Older name of `sender`.
        text:
          type: string
          deprecated: true
          description: Older name of `message`.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: The kind of problem, for example `/errors/validation`; stable, safe to branch on.
        title:
          type: string
          description: A human-readable summary.
        status:
          type: integer
        correlationId:
          type: string
          format: uuid
          description: Quote this to the operator.
        errors:
          type: array
          description: Validation problems (400 only).
          items:
            type: object
            required:
              - path
              - code
              - message
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
        permission:
          type: string
          description: The missing permission (403 only).
